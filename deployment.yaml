apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-energy-monitor
  labels:
    app: energy-monitor
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: energy-monitor
  template:
    metadata:
      labels:
        app: energy-monitor
    spec:
      containers:
      - name: web
        image: YOUR_DOCKERHUB_USERNAME/campus-energy-monitor:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: campus-energy-service
spec:
  type: NodePort
  selector:
    app: energy-monitor
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
