<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus Energy Monitoring System</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 30px; background-color: #f4f6f9; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .summary-card { background: #e8f4fd; border-left: 5px solid #2980b9; padding: 15px; margin-bottom: 25px; border-radius: 4px; }
        .card { border: 1px solid #e1e8ed; padding: 15px; margin-bottom: 15px; border-radius: 6px; }
        .warning { background-color: #fff3cd; border-color: #ffeeba; color: #856404; }
        .alert { color: #c0392b; font-weight: bold; margin-top: 5px; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; background: #27ae60; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Smart Campus Energy Monitor</h1>
        
        <!-- Enhancement Commit Section: Campus Summary -->
        <div class="summary-card" id="summary">
            <h3>Campus Energy Summary</h3>
            <p><strong>Total Consumption:</strong> <span id="total-consumption">0</span> kWh</p>
            <p><strong>Highest Consumer:</strong> <span id="highest-consumer">None</span></p>
        </div>

        <!-- Building Grid -->
        <div id="building-list"></div>
    </div>

    <script>
        const LIMIT_KWH = 100;
        const campusData = [
            { name: "Engineering Block", consumption: 125, target: 90 },
            { name: "Science Complex", consumption: 85, target: 80 },
            { name: "Central Library", consumption: 110, target: 70 }
        ];

        let totalConsumption = 0;
        let highestBuilding = campusData[0];
        const listContainer = document.getElementById("building-list");

        campusData.forEach(b => {
            totalConsumption += b.consumption;
            if (b.consumption > highestBuilding.consumption) {
                highestBuilding = b;
            }

            const isExceeded = b.consumption > LIMIT_KWH;
            const excess = b.consumption - LIMIT_KWH;

            const card = document.createElement("div");
            card.className = `card ${isExceeded ? 'warning' : ''}`;
            card.innerHTML = `
                <h3>${b.name}</h3>
                <p><strong>Daily Usage:</strong> ${b.consumption} kWh</p>
                <p><strong>Target:</strong> ${b.target} kWh</p>
                ${isExceeded ? `<p class="alert">⚠️ Warning: Exceeded threshold (100 kWh) by ${excess} kWh!</p>` : `<span class="badge">Within Budget</span>`}
            `;
            listContainer.appendChild(card);
        });

        document.getElementById("total-consumption").innerText = totalConsumption;
        document.getElementById("highest-consumer").innerText = `${highestBuilding.name} (${highestBuilding.consumption} kWh)`;
    </script>
</body>
</html>
